[package]
name = "mail-vanity"
version = "0.1.0"
edition = "2021"
description = "Vanity inbox addresses for Freenet Mail identities"
license = "GPL-3.0-or-later"
repository = "https://github.com/verygeeky/freenet-keygen-cuda"
publish = false

[dependencies]
# Pinned to match contracts/inbox/Cargo.toml in freenet/mail. The verifying-key
# encoding is what the inbox contract id is derived over, so a version skew here
# silently produces addresses the mail app will never agree with.
# `default-features = false` matches the inbox contract's own dep line; leaving
# defaults on pulls in the pkcs8 feature, which fails to compile against the
# resolved pkcs8 0.11.0.
ml-dsa = { version = "=0.1.0-rc.8", default-features = false, features = ["alloc"] }
blake3 = "1"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
