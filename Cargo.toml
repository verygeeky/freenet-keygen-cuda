[package]
name = "website-vanity"
version = "0.1.0"
edition = "2021"
description = "CPU vanity search for Freenet website contract keys"
license = "GPL-3.0-or-later"
repository = "https://github.com/verygeeky/freenet-keygen-cuda"
publish = false

[dependencies]
ed25519-dalek = "2"
blake3 = "1"
bs58 = "0.5"
rand = "0.8"
rayon = "1"
num-bigint = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
